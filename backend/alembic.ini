# Alembic config. The app runs `alembic upgrade head` itself on startup
# (core/migrations.py); this file is for running alembic by hand, e.g.
#   alembic revision -m "add foo column"
#   alembic upgrade head
[alembic]
script_location = migrations
# sqlalchemy.url is filled in from core.config.settings by migrations/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
